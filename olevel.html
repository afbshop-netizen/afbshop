<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Test Dashboard</title>

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}

/* LOGIN */
#loginPage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.login-box{
  background:white;
  padding:30px;
  width:300px;
  box-shadow:0 0 10px #aaa;
}
.login-box input{
  width:100%;
  margin:10px 0;
  padding:8px;
}
.login-box button{
  width:100%;
  padding:8px;
  background:#4f46e5;
  color:white;
  border:none;
}

/* DASHBOARD */
#dashboard{
  display:none;
}
.sidebar{
  height:100vh;
  background:#1e1e2f;
  color:white;
  padding:20px;
  animation:slide 0.5s ease;
}
@keyframes slide{
  from{transform:translateX(-100%)}
  to{transform:translateX(0)}
}
.sidebar ul{
  list-style:none;
  padding:0;
}
.sidebar ul li{
  padding:12px;
  margin:8px 0;
  background:#2a2a40;
  cursor:pointer;
  border-radius:6px;
}
.sidebar ul li:hover{
  background:#4f46e5;
}

.content{
  padding:30px;
}
.card{
  transition:0.3s;
}
.card:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h3 class="text-center">Login</h3>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container-fluid">
  <div class="row">

    <div class="col-md-2 sidebar">
      <h4>TestBook</h4>
      <ul>
        <li onclick="loadPage('ssc')">SSC CGL</li>
        <li onclick="loadPage('rrb')">RRB Group D</li>
        <li onclick="loadPage('ca')">Current Affairs</li>
        <li onclick="loadPage('practice')">Practice</li>
      </ul>
    </div>

    <div class="col-md-10 content" id="content">
      <h2>Welcome 🎯</h2>
      <p>Left menu se option select karo</p>
    </div>

  </div>
</div>

<script>
function login(){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").style.display="block";
}

function loadPage(page){
  let c=document.getElementById("content");

  if(page==="ssc"){
    c.innerHTML=`
    <h2>SSC CGL</h2>
    <div class="row">
      <div class="col-md-4"><div class="card p-3">Full Mock Tests</div></div>
      <div class="col-md-4"><div class="card p-3">Sectional Tests</div></div>
      <div class="col-md-4"><div class="card p-3">Previous Papers</div></div>
    </div>`;
  }

  if(page==="rrb"){
    c.innerHTML=`
    <h2>RRB Group D</h2>
    <div class="row">
      <div class="col-md-6"><div class="card p-3">Practice Sets</div></div>
      <div class="col-md-6"><div class="card p-3">Mock Tests</div></div>
    </div>`;
  }

  if(page==="ca"){
    c.innerHTML=`
    <h2>Current Affairs</h2>
    <div class="card p-3">Daily & Monthly CA</div>`;
  }

  if(page==="practice"){
    c.innerHTML=`
    <h2>Practice Zone</h2>
    <div class="card p-3">Topic wise Questions</div>`;
  }
}
</script>

</body>
</html>
