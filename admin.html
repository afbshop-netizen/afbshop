<!DOCTYPE html>
<html>
<head>
<title>AFB Shop - Admin</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; margin:0; background:#f2f2f2; }
h2 { text-align:center; padding:10px; }

.admin-box{
  background:white;
  padding:15px;
  margin:10px;
  border-radius:8px;
}

input, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  padding:8px 15px;
  border:none;
  background:black;
  color:white;
  cursor:pointer;
  margin-top:5px;
  border-radius:5px;
}

#products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
  padding:10px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product-content{
  padding:10px;
}

.product h3{
  font-size:14px;
  margin:5px 0;
  min-height:36px;
}

.product h4{
  margin:5px 0;
  font-weight:bold;
}

.product p{
  font-size:13px;
  margin:2px 0;
  color:#555;
}

.edit-btn{ background:green; }
.action-btn{ background:red; }

#detail{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  display:none;
  overflow:auto;
  padding:20px;
}

#detail h3{ margin-top:10px; }
#detail h2{ margin:5px 0; color:black; }
.slider img{ width:100%; height:250px; object-fit:cover; margin-bottom:10px; border-radius:8px; }

</style>
</head>
<body>

<h2>AFB Shop - Admin Panel</h2>

<div class="admin-box">
<h3>Add / Edit Product</h3>
<input id="name" placeholder="Product Name">
<input id="brand" placeholder="Brand Name">
<input id="price" type="number" placeholder="Price">
<input id="discount" type="number" placeholder="Discount %">
<input id="category" placeholder="Category">
<textarea id="features" placeholder="Features / Description"></textarea>
<input id="image" type="file" multiple>
<button onclick="saveProduct()">Save Product</button>
</div>

<div id="products"></div>

<div id="detail">
<button onclick="closeDetail()">⬅ Back</button>
<div class="slider" id="slider"></div>
<h3 id="dname"></h3>
<h2 id="dprice"></h2>
<p id="dcat"></p>
<p id="dbrand"></p>
<p id="ddiscount"></p>
<p id="dfeatures"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDDufb2t6vj8WNETg8oqyBf9FtO4MOlfPs",
authDomain: "afbshop-355e1.firebaseapp.com",
projectId: "afbshop-355e1",
storageBucket: "afbshop-355e1.firebasestorage.app",
messagingSenderId: "607607033369",
appId: "1:607607033369:web:b505b30fe89336ebc1a488"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLOUD_NAME="dwairftsx";
const UPLOAD_PRESET="afbshop";

let editId=null;
let oldImages=[];

async function uploadToCloudinary(file){
  const formData=new FormData();
  formData.append("file",file);
  formData.append("upload_preset",UPLOAD_PRESET);

  const url=`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
  const res=await fetch(url,{method:"POST",body:formData});
  const data=await res.json();

  if(!data.secure_url){
    alert("Upload Failed");
    throw new Error("Upload Error");
  }

  return data.secure_url;
}

window.saveProduct=async function(){
  const name=nameInput.value;
  const brand=document.getElementById("brand").value;
  const price=priceInput.value;
  const discount=document.getElementById("discount").value;
  const category=categoryInput.value;
  const features=document.getElementById("features").value;
  const files=imageInput.files;

  if(!name || !price){ alert("Fill required fields"); return; }

  let imageURLs=[...oldImages];
  for(let i=0;i<files.length;i++){
    const url=await uploadToCloudinary(files[i]);
    imageURLs.push(url);
  }

  if(editId){
    await updateDoc(doc(db,"products",editId),{
      name,brand,price,discount,category,features,images:imageURLs
    });
    editId=null; oldImages=[];
  }else{
    await addDoc(collection(db,"products"),{
      name,brand,price,discount,category,features,images:imageURLs
    });
  }

  document.querySelectorAll("input, textarea").forEach(i=>i.value="");
  loadProducts();
}

const productsDiv=document.getElementById("products");
const nameInput=document.getElementById("name");
const priceInput=document.getElementById("price");
const categoryInput=document.getElementById("category");
const imageInput=document.getElementById("image");

async function loadProducts(){
  productsDiv.innerHTML="";
  const snap=await getDocs(collection(db,"products"));

  snap.forEach(d=>{
    const data=d.data();
    productsDiv.innerHTML+=`
    <div class="product">
      <img src="${data.images?.[0] || ''}">
      <div class="product-content">
        <h3>${data.name}</h3>
        <h4>₹${data.price} ${data.discount ? `(${data.discount}% OFF)` : ""}</h4>
        <p>Category: ${data.category||''}</p>
        <button onclick="showDetail(${JSON.stringify(data).replace(/"/g,'&quot;')})">View</button>
        <button class="edit-btn" onclick="editProduct('${d.id}',${JSON.stringify(data).replace(/"/g,'&quot;')})">Edit</button>
        <button class="action-btn" onclick="deleteProduct('${d.id}')">Delete</button>
      </div>
    </div>
    `;
  });
}

window.deleteProduct=async function(id){
  await deleteDoc(doc(db,"products",id));
  loadProducts();
}

window.editProduct=function(id,data){
  editId=id;
  nameInput.value=data.name;
  priceInput.value=data.price;
  categoryInput.value=data.category||"";
  document.getElementById("brand").value=data.brand||"";
  document.getElementById("discount").value=data.discount||"";
  document.getElementById("features").value=data.features||"";
  oldImages=data.images||[];
}

window.showDetail=function(data){
  document.getElementById("detail").style.display="block";
  document.getElementById("dname").innerText=data.name;
  document.getElementById("dprice").innerText="₹"+data.price;
  document.getElementById("dcat").innerText="Category: "+(data.category||'');
  document.getElementById("dbrand").innerText="Brand: "+(data.brand||'');
  document.getElementById("ddiscount").innerText=data.discount?data.discount+"% OFF":"";
  document.getElementById("dfeatures").innerText=data.features||"";

  const slider=document.getElementById("slider");
  slider.innerHTML="";
  if(data.images){
    data.images.forEach(img=>{
      slider.innerHTML+=`<img src="${img}">`;
    });
  }
}

window.closeDetail=function(){
  document.getElementById("detail").style.display="none";
}

loadProducts();

</script>
</body>
</html>
